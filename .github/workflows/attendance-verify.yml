name: Verify standalone attendance page
on:
  pull_request:
    paths: ['attendance/**', 'portal.js', 'modules.json', '.github/workflows/attendance-verify.yml']
  push:
    branches: [main]
    paths: ['attendance/**', 'portal.js', 'modules.json', '.github/workflows/attendance-verify.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate standalone page and privacy protections
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import vm from 'node:vm';
          import assert from 'node:assert/strict';
          const html = fs.readFileSync('attendance/index.html','utf8');
          const inline = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(x => x[1]).find(Boolean);
          assert.ok(inline,'Inline client code missing');
          new vm.Script(inline,{filename:'attendance-client.js'});
          assert.match(html,/navigator\.languages/);
          assert.doesNotMatch(html,/Authorization:'Bearer '|shareForm|shareAccess/);
          assert.match(html,/credentials:'omit'/);
          assert.doesNotMatch(html,/location\.hash/);
          assert.match(html,/<meta name="robots" content="noindex/);
          // Native iOS date inputs have intrinsic minimum widths. On phone-sized
          // viewports the range must stack into one full-width column.
          assert.match(html,/\.field input\{[^}]*min-width:0;max-width:100%/);
          const mobileCss = html.split('@media(max-width:660px)')[1]?.split('@media print')[0] || '';
          assert.match(mobileCss,/\.period\{display:grid;grid-template-columns:minmax\(0,1fr\)/);
          assert.match(html,/\.period-actions\{display:grid;grid-template-columns:repeat\(2,minmax\(0,1fr\)\)/);
          assert.match(html,/type="date" id="from"/);
          assert.match(html,/type="date" id="to"/);
          assert.match(html,/<span class="date-input-frame"><input type="date" id="from" required><\/span>/);
          assert.match(html,/<span class="date-input-frame"><input type="date" id="to" required><\/span>/);
          assert.match(mobileCss,/\.date-input-frame\{[^}]*width:100%;[^}]*overflow:hidden/);
          assert.match(mobileCss,/\.field input\{[^}]*inline-size:100%;max-inline-size:100%;[^}]*border:0/);
          assert.doesNotMatch(html,/\b(password|residentId|accountNumber|salary|payroll)\b/i);
          const appList = JSON.parse(fs.readFileSync('modules.json','utf8'));
          assert.deepEqual(appList.slice(0,2).map(m=>m.id),['staff','attendance']);
          assert.equal(appList[0].group,'매장 운영');
          assert.equal(appList[1].group,'매장 운영');
          assert.equal(appList[1].href,'attendance/');
          assert.equal(appList[1].icon,'calendar');
          const homeJs = fs.readFileSync('portal.js','utf8');
          new vm.Script('(async()=>{\n'+homeJs+'\n})()',{filename:'portal.js'});
          assert.match(homeJs,/calendar:/);
          assert.doesNotMatch(homeJs,/#key=|Bearer /);
          assert.doesNotMatch(JSON.stringify(appList),/#key=|Bearer /);
          assert.match(appList[1].description,/로그인 없이/);
          console.log('Homepage placement and attendance page syntax/privacy checks passed');
          NODE
